<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL 2 Million Points with Zoom and Pan</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        canvas { width: 100%; height: 100%; display: block; }
        #fps {
            position: fixed;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 5px;
            border-radius: 5px;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>
<div id="fps"></div>
<canvas id="glCanvas"></canvas>
<script>
    function displayFPS() {
        const fpsContainer = document.getElementById("fps");

        let lastTime = performance.now();
        let frames = 0;

        function update() {
            const currentTime = performance.now();
            frames++;

            if (currentTime - lastTime >= 1000) {
                fpsContainer.innerText = `FPS: ${frames}`;
                lastTime = currentTime;
                frames = 0;
            }

            requestAnimationFrame(update);
        }

        update();
    }

    window.onload = displayFPS;
</script>
<!--<script type="module" src="./scripts/regular_canvas_render.js">-->
<script type="module" src="./scripts/web_gl.js">

</script>
</body>
</html>
